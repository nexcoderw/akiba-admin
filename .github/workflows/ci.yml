name: Verify Akiba Admin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Admin
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: ./node_modules/.bin/next typegen

      - name: Type-check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
